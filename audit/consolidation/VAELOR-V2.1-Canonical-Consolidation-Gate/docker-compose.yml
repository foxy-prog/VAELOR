services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaelor
      POSTGRES_USER: vaelor
      POSTGRES_PASSWORD: ${VAELOR_POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - vaelor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaelor -d vaelor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vaelor-postgres:
